# Small z-invariant x-y plane wave on one static FMR refinement level.
[simulation_parameters]
name = "Single-level FMR 2D linear wave"
solver = "electrodynamic_yee"

Nx = 32
Ny = 32
Nz = 5
x_min = 0.0
x_max = 1.0
y_min = 0.0
y_max = 1.0
z_min = 0.0
z_max = 5.0

Nt = 64
cfl = 0.8
C = 1.0
eps = 1.0
mu = 1.0

x_bc = "periodic"
y_bc = "periodic"
z_bc = "periodic"
guard_cells = 2
shape_factor = 1

# The first FMR implementation requires one root tile.
particle_tile_nx = 32
particle_tile_ny = 32
particle_tile_nz = 5

[plotting]
plot_openpmd_fields = true
plotting_interval = 4
openpmd_field_queue_size = 2

[fmr]
enabled = true

[[fmr.levels]]
parent = 0
refinement_ratio = 2
coarse_start = [8, 8, 1]
coarse_stop = [24, 24, 4]
